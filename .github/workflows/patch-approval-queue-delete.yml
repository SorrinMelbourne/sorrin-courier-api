name: Patch approvals queue and delete flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-approval-queue-delete.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Operations patch
        run: python3 scripts/patch_ops_approval_delete.py
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Commit patch
        run: |
          if git diff --quiet -- worker.js; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "SorrinMelbourne"
          git config user.email "speak2salem@gmail.com"
          git add worker.js
          git commit -m "Add quick approvals and fix job delete"
          git push origin main
