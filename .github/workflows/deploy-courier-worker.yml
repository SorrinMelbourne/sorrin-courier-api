name: Deploy courier Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - ".github/workflows/deploy-courier-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sorrin-courier-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Publish Worker code without changing Cloudflare bindings or settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/sorrin-courier-api/content"

          HTTP_CODE=$(curl -sS -o /tmp/deploy-result.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@worker.js;type=application/javascript+module' \
            "$API")

          python3 - "$HTTP_CODE" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          raw = Path('/tmp/deploy-result.json').read_text(errors='replace')
          try:
              data = json.loads(raw)
          except Exception:
              raise SystemExit(f'Cloudflare returned HTTP {status}: {raw[:1000]}')

          if status >= 400 or data.get('success') is not True:
              raise SystemExit(f'Cloudflare Worker deployment failed (HTTP {status}): {json.dumps(data.get("errors") or data)}')

          print('Cloudflare Worker content deployment succeeded; existing bindings and settings were left untouched.')
          PY
